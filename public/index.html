<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Video Downloader 🍘</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 50% 0%, #273b76, #0e1224 55%); color: #f4f6ff; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    main { width: min(100%, 580px); background: #171c34; border: 1px solid #354166; border-radius: 24px; padding: 26px; box-shadow: 0 18px 45px #0005; }
    h1 { font-size: 26px; margin: 0 0 10px; }
    p, small { color: #b6c0db; line-height: 1.5; }
    label { display: block; margin: 20px 0 7px; font-weight: 600; }
    input, select, button, a.action { width: 100%; padding: 14px; border-radius: 11px; border: 1px solid #45557f; font-size: 15px; }
    input, select { background: #10162b; color: #fff; }
    button, a.action { background: #7c8bff; color: #090e20; font-weight: 800; cursor: pointer; border: 0; display: inline-block; text-decoration: none; text-align: center; margin-top: 15px; }
    button:disabled { opacity: .65; cursor: progress; }
    #result { margin-top: 20px; display: none; padding: 16px; border: 1px solid #3b4971; border-radius: 15px; overflow-wrap: anywhere; }
    #result img { display: block; max-width: 100%; max-height: 260px; object-fit: contain; margin-bottom: 12px; border-radius: 8px; }
    #result h2 { font-size: 17px; }
    footer { margin-top: 20px; text-align: center; color: #a7b3d3; }
  </style>
</head>
<body>
  <main>
    <h1>🎬 HR Video Downloader</h1>
    <p>Instagram • Facebook • YouTube • Pinterest</p>
    <form id="form">
      <label for="url">Public video URL</label>
      <input id="url" type="url" required maxlength="2048" placeholder="https://www.instagram.com/reel/...">
      <label for="quality">Quality</label>
      <select id="quality">
        <option value="best">Best available</option>
        <option value="1080">1080p or below</option>
        <option value="720">720p or below</option>
        <option value="480">480p or below</option>
        <option value="360">360p or below</option>
      </select>
      <button id="submit" type="submit">Get video link</button>
    </form>
    <section id="result" aria-live="polite"></section>
    <small>শুধু নিজের বা অনুমতি-প্রাপ্ত পাবলিক ভিডিও ব্যবহার করুন। কিছু লিংক browser-এ সরাসরি download না হয়ে play হতে পারে।</small>
    <footer>Developer SK HABIBULLA 🍘</footer>
  </main>
  <script>
    const form = document.getElementById('form');
    const submit = document.getElementById('submit');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      submit.textContent = 'Checking video...';
      result.style.display = 'block';
      result.textContent = 'Please wait...';
      try {
        const params = new URLSearchParams({
          url: document.getElementById('url').value.trim(),
          quality: document.getElementById('quality').value
        });
        const response = await fetch('/api/download?' + params.toString());
        const data = await response.json();
        result.replaceChildren();
        if (!response.ok || !data.success) throw new Error(data.detail || data.error || 'Not found');
        if (data.thumbnail) {
          const image = document.createElement('img');
          image.src = data.thumbnail;
          image.alt = 'Video thumbnail';
          result.appendChild(image);
        }
        const title = document.createElement('h2');
        title.textContent = data.title;
        result.appendChild(title);
        const meta = document.createElement('p');
        meta.textContent = `${data.platform} · ${data.quality} · ${data.extension}`;
        result.appendChild(meta);
        const link = document.createElement('a');
        link.className = 'action';
        link.href = data.download_url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Open video / Save';
        result.appendChild(link);
        const note = document.createElement('p');
        note.textContent = data.note;
        result.appendChild(note);
      } catch (error) {
        result.textContent = error.message;
      } finally {
        submit.disabled = false;
        submit.textContent = 'Get video link';
      }
    });
  </script>
</body>
</html>
